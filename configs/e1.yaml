# Configuración de E1 (shots finitos, sin ruido). Solo incluye QCNN, porque
# las CNN análogas no tienen circuito que medir. La variable independiente
# es el presupuesto de shots (256, 1024 y 4096), no el modelo.
#
# `models` es un marcador. El notebook y los scripts lo reemplazan por
# MODELS_TO_RUN, que incluye a Hur, Wei y Gong, y a Cong solo si
# INCLUDE_CONG_IN_E1_E2 es verdadero:
#
#   config = config.model_copy(update={"models": MODELS_TO_RUN})
#
# El campo `description` forma parte del hash, así que editarlo desvincula
# la configuración de los resultados ya guardados.

experiment_id: E1_FINITE_SHOTS
description: >
  ¿Cómo se degrada (o no) la exactitud de WINNER_MODEL (y de Cong, si
  INCLUDE_CONG_IN_E1_E2) al pasar del simulador analítico de E0 a
  medición por shots finitos, sin ruido de hardware todavía? Compara los
  tres presupuestos de shots entre sí (no modelos entre sí) sobre los
  mismos tres datasets y el mismo protocolo de entrenamiento -- el ruido
  de muestreo también afecta al gradiente durante el entrenamiento, no
  solo a la exactitud de prueba (ver qcnn_benchmark.execution.shots).

datasets:
  - name: coat_vs_shirt
    source: fashion_mnist
    class_pos: 4  # Coat
    class_neg: 6  # Shirt
  - name: "4_vs_9"
    source: mnist
    class_pos: 4
    class_neg: 9
  - name: "1_vs_0"
    source: mnist
    class_pos: 1
    class_neg: 0

models:
  - placeholder_winner  # el notebook lo reemplaza por MODELS_TO_RUN

shots_budgets: [256, 1024, 4096]

protocol:
  batch_size: 25
  n_updates: 500
  learning_rate: 0.01
  beta1: 0.9
  beta2: 0.999
  clip_norm: 5.0
  val_check_every: 10
  patience_checks: 5
  min_delta: 0.0001

n_seeds: 5
seed_root: 0
sample_seed: 20260802

statistical_criterion:
  aggregation: mean_per_dataset
  ci_method: bootstrap_bca
  n_bootstrap: 10000
  confidence_level: 0.95
  comparison_test: paired_sign_permutation
  multiple_comparison_correction: holm
  alpha: 0.05
