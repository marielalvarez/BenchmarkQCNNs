# Configuración de E0A: selección del mejor candidato entre Hur, Wei y Gong
# sobre tres tareas binarias (Fashion-MNIST coat vs. shirt, MNIST 4 vs. 9 y
# MNIST 1 vs. 0).
#
# Se valida con qcnn_benchmark.config.load_config("configs/e0a.yaml") y la
# corrida se identifica con config.canonical_hash(). El campo `description`
# forma parte del hash, así que editarlo desvincula la configuración de los
# resultados ya guardados.

experiment_id: E0A
description: >
  Comparación Hur vs. Wei vs. Gong (E0, sin ruido, simulador analítico) sobre
  los tres datasets del rediseño de Semana 2, para seleccionar el candidato
  que avanza a E1/E2. Cong queda fuera de E0A -- es la QCNN genérica de
  referencia de E0B (validez de la aportación), no un candidato a "mejor".

datasets:
  - name: coat_vs_shirt
    source: fashion_mnist
    class_pos: 4  # Coat
    class_neg: 6  # Shirt
  - name: "4_vs_9"
    source: mnist
    class_pos: 4
    class_neg: 9
  - name: "1_vs_0"
    source: mnist
    class_pos: 1
    class_neg: 0

models:
  - hur
  - wei
  - gong

protocol:
  batch_size: 25
  # Con 200 actualizaciones Wei no converge en su dataset de referencia
  # (94.8% frente al 96.3% publicado) y con 500 llega a 95.8% (ver
  # notebooks/00_reproduce_wei.ipynb, Sec. 3.1). Los tres modelos comparten
  # el mismo tope para que ninguno tenga ventaja de presupuesto. El early
  # stopping sigue activo, así que un modelo que converge antes se detiene
  # sin llegar a 500.
  n_updates: 500
  learning_rate: 0.01
  beta1: 0.9
  beta2: 0.999
  clip_norm: 5.0
  val_check_every: 10
  patience_checks: 5
  min_delta: 0.0001

n_seeds: 5
seed_root: 0  # run_seeds = [0, 1, 2, 3, 4], la semilla 0 coincide con las reproducciones de los papers
sample_seed: 20260802  # igual a qcnn_benchmark.data.sampling.SAMPLE_SEED, misma partición en todos los experimentos

statistical_criterion:
  aggregation: mean_per_dataset
  ci_method: bootstrap_bca
  n_bootstrap: 10000
  confidence_level: 0.95
  comparison_test: paired_sign_permutation
  multiple_comparison_correction: holm
  alpha: 0.05
