# Configuración de E0B: WINNER_MODEL (el ganador de E0A) contra qcnn_cong,
# la QCNN genérica de Cong et al., con el mismo protocolo y criterio
# estadístico que E0A. Sirve para ver si la aportación específica de
# WINNER_MODEL (codificación, ansatz, lectura) mejora algo frente a una
# QCNN jerárquica genérica.
#
# `models` es un marcador, igual que en e0_quantum_advantage.yaml. El
# notebook lo reemplaza así:
#
#   config = config.model_copy(update={"models": [WINNER_MODEL, "cong"]})
#
# El campo `description` forma parte del hash, así que editarlo desvincula
# la configuración de los resultados ya guardados.

experiment_id: E0B
description: >
  ¿WINNER_MODEL (Hur, Wei o Gong, el que haya ganado E0A) supera a la QCNN
  genérica de Cong et al. (SU4 + Pooling_ansatz1 + AngleEmbedding, sin
  sesgo de diseño de ningún paper específico)? Este es el sub-experimento
  de "validez de la aportación": si WINNER_MODEL no supera a Cong de forma
  consistente, la aportación específica de su paper (encoding denso,
  filtro LCU, encoding tree-hybrid) no se estaría traduciendo en ventaja
  real sobre una arquitectura QCNN jerárquica genérica.

datasets:
  - name: coat_vs_shirt
    source: fashion_mnist
    class_pos: 4  # Coat
    class_neg: 6  # Shirt
  - name: "4_vs_9"
    source: mnist
    class_pos: 4
    class_neg: 9
  - name: "1_vs_0"
    source: mnist
    class_pos: 1
    class_neg: 0

models:
  - placeholder_winner  # el notebook lo reemplaza por [WINNER_MODEL, "cong"]

protocol:
  batch_size: 25
  n_updates: 500
  learning_rate: 0.01
  beta1: 0.9
  beta2: 0.999
  clip_norm: 5.0
  val_check_every: 10
  patience_checks: 5
  min_delta: 0.0001

n_seeds: 5
seed_root: 0
sample_seed: 20260802

statistical_criterion:
  aggregation: mean_per_dataset
  ci_method: bootstrap_bca
  n_bootstrap: 10000
  confidence_level: 0.95
  comparison_test: paired_sign_permutation
  multiple_comparison_correction: holm
  alpha: 0.05
