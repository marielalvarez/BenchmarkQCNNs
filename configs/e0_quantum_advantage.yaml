# Configuración de E0_quantum_advantage: WINNER_MODEL (el ganador de E0A)
# contra su CNN análoga (cnn_<winner>_analoga), con el mismo protocolo y
# criterio estadístico que E0A.
#
# `models` es un marcador, porque WINNER_MODEL sale de la Sec. 10 de
# E0A_seleccion_candidato.ipynb. El notebook lo reemplaza antes de usar la
# configuración:
#
#   config = config.model_copy(update={"models": [WINNER_MODEL, f"cnn_{WINNER_MODEL}_analoga"]})
#
# Esto cambia canonical_hash() a propósito, para que corridas con distinto
# WINNER_MODEL queden en archivos de resultados distintos.
#
# El campo `description` forma parte del hash, así que editarlo desvincula
# la configuración de los resultados ya guardados.

experiment_id: E0_QUANTUM_ADVANTAGE
description: >
  ¿El QCNN ganador de E0A supera a una CNN clásica con conteo de
  parámetros comparable? Resultado informativo para la narrativa de
  Quantum Advantage del paper -- no alimenta ninguna decisión de E0B/E1/E2
  (esas fases usan WINNER_MODEL directamente, no el resultado de esta
  comparación). Dado lo observado en E0A (n=5 semillas), es esperable que
  el test de permutación de signo tampoco alcance significancia aquí --
  por eso el análisis también reporta solape de IC bootstrap BCa como
  evidencia complementaria desde el inicio, no como parche posterior.

datasets:
  - name: coat_vs_shirt
    source: fashion_mnist
    class_pos: 4  # Coat
    class_neg: 6  # Shirt
  - name: "4_vs_9"
    source: mnist
    class_pos: 4
    class_neg: 9
  - name: "1_vs_0"
    source: mnist
    class_pos: 1
    class_neg: 0

models:
  - placeholder_winner  # el notebook lo reemplaza por [WINNER_MODEL, "cnn_<winner>_analoga"]

protocol:
  batch_size: 25
  n_updates: 500  # mismo tope que E0A
  learning_rate: 0.01
  beta1: 0.9
  beta2: 0.999
  clip_norm: 5.0
  val_check_every: 10
  patience_checks: 5
  min_delta: 0.0001

n_seeds: 5
seed_root: 0
sample_seed: 20260802

statistical_criterion:
  aggregation: mean_per_dataset
  ci_method: bootstrap_bca
  n_bootstrap: 10000
  confidence_level: 0.95
  comparison_test: paired_sign_permutation
  multiple_comparison_correction: holm
  alpha: 0.05
